<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 40px;
      color: #333;
    }
    .header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 30px;
    }
    .invoice-title {
      font-size: 24px;
      font-weight: bold;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 10px;
      text-align: left;
    }
    th {
      background: #f5f5f5;
    }
    .total {
      text-align: right;
      margin-top: 20px;
      font-size: 18px;
    }
  </style>
</head>
<body>

  <div class="header">
    <div>
      <div class="invoice-title">INVOICE</div>
      <div>Invoice #: {{invoiceNumber}}</div>
      <div>Date: {{date}}</div>
    </div>
    <div>
      <strong>{{companyName}}</strong><br/>
      {{companyAddress}}
    </div>
  </div>

  <div>
    <strong>Billed To:</strong><br/>
    {{customerName}}<br/>
    {{customerEmail}}
  </div>

  <table>
    <thead>
      <tr>
        <th>Item</th>
        <th>Qty</th>
        <th>Price</th>
        <th>Total</th>
      </tr>
    </thead>
    <tbody>
      {{items}}
    </tbody>
  </table>

  <div class="total">
    <strong>Grand Total: ₹{{total}}</strong>
  </div>

</body>
</html>
